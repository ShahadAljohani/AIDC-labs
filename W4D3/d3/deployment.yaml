        - name: serving
          # EDIT: your own wk2 image
          image: shahad09/aidc-serving:cpu-v1
          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi

          lifecycle:
            preStop:
              sleep:
                seconds: 5

          env:
            - name: MODEL_BACKEND
              value: "echo"
            - name: MODEL_ID
              value: "Qwen/Qwen2.5-0.5B-Instruct"
            - name: APP_VERSION
              value: "v1"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 2
            failureThreshold: 2

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 5